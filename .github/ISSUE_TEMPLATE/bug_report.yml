name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start server with `uv run voice-agent`
        2. Connect to WebSocket
        3. Send audio chunk
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs or error messages
      render: shell
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.12.0"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 22.04"
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "GTX 1650 Ti 4GB"
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
