[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time Vietnamese Voice Agent — ASR + LLM + TTS Pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "nguyendevwk", email = "phamnguyen.devwk@gmail.com" }]
keywords = ["voice-agent", "asr", "tts", "vietnamese", "real-time", "ai", "speech", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
homepage = "https://github.com/nguyendevwk/end2end_asr_vie"
repository = "https://github.com/nguyendevwk/end2end_asr_vie"
documentation = "https://github.com/nguyendevwk/end2end_asr_vie/tree/main/docs"

dependencies = [
    # ═══════════════════════════════════════════════════════════════════════════
    # 🌐 Web Framework - High-performance async server
    # ═══════════════════════════════════════════════════════════════════════════
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🧠 AI/ML Core - PyTorch ecosystem
    # ═══════════════════════════════════════════════════════════════════════════
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🎙️ ASR - Qwen3-ASR (Alibaba) with vLLM backend for 10x faster inference
    # Supports 52 languages including Vietnamese
    # ═══════════════════════════════════════════════════════════════════════════
    "qwen-asr[vllm]>=0.0.6",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🔊 TTS - Qwen3-TTS (Alibaba) with voice cloning & streaming
    # Ultra-low latency: 97ms first packet
    # ═══════════════════════════════════════════════════════════════════════════
    "qwen-tts>=0.1.1",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🔇 VAD - Silero (via torch.hub) - No extra package needed
    # ═══════════════════════════════════════════════════════════════════════════
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🤖 LLM - Groq API (OpenAI compatible) - Llama 3.3 70B @ 330 tokens/s
    # ═══════════════════════════════════════════════════════════════════════════
    "openai>=1.50.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🎵 Audio Processing
    # ═══════════════════════════════════════════════════════════════════════════
    "numpy>=2.0.0",
    "soundfile>=0.12.0",
    "scipy>=1.14.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # ⚙️ Configuration & Validation
    # ═══════════════════════════════════════════════════════════════════════════
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 📊 Logging & Monitoring
    # ═══════════════════════════════════════════════════════════════════════════
    "structlog>=24.0.0",
    
    # ═══════════════════════════════════════════════════════════════════════════
    # 🧪 Test Client (Flask web UI)
    # ═══════════════════════════════════════════════════════════════════════════
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Flash Attention (optional, for faster inference)
flash = [
    "flash-attn>=2.7.0",
]

[project.scripts]
voice-agent = "voice_agent.main:main"
voice-agent-client = "web_client.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent", "web_client"]

# ============== UV DEPENDENCY RESOLUTION ==============
# Override conflicting transformers versions between qwen-asr (4.57.6) and qwen-tts (4.57.3)
# Pin to 4.57.6 which is required by qwen-asr
[tool.uv]
override-dependencies = [
    "transformers==4.57.6",
]

# ============== RUFF ==============
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["voice_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ============== MYPY ==============
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "soundfile.*",
    "scipy.*",
    "qwen_asr.*",
    "qwen_tts.*",
]
ignore_missing_imports = true

# ============== PYTEST ==============
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
    "benchmark: marks tests as benchmark",
    "gpu: marks tests as requiring GPU",
]

# ============== COVERAGE ==============
[tool.coverage.run]
source = ["voice_agent"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
